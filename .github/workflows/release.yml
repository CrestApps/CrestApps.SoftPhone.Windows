name: Release

# Build all distributables (installer .exe, portable .zip, MSIX) with the correct version:
#   • push a tag  vX.Y.Z         → build + attach to a GitHub Release (downloadable), and
#                                   (opt-in, when STORE_APP_ID is set) submit the MSIX to the Store
#   • run manually (workflow_dispatch, version input) → build artifacts only
# The Store step is best-effort and gated on STORE_APP_ID, so releases stay clean before Partner
# Center is configured; publish-manual.yml is the on-demand / draft-submission path. If code-signing
# secrets are set (SIGNING_PFX_BASE64 + SIGNING_PFX_PASSWORD), the app exe, installer, and MSIX are signed.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 1.0.0 (no leading v)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    # The signing secrets live in the "production" environment, so the build job must
    # declare it to read them. If that environment has required-reviewer protection, the
    # build will pause for approval — move the two SIGNING_* secrets to repository secrets
    # (and drop this line) if you'd rather the build never wait.
    environment: production
    env:
      # Job-level so step `if:` conditions can see whether signing / the Store are configured.
      SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
      SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
      STORE_APP_ID: ${{ secrets.STORE_APP_ID }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: microsoft/setup-msbuild@v2

      - name: Derive version (tag or manual input)
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then V="${{ inputs.version }}"; else V="${GITHUB_REF_NAME}"; fi
          echo "version=${V#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp MSIX manifest version
        run: pwsh scripts/Set-Version.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Restore + build + unit tests
        env:
          SOFTPHONE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          dotnet restore CrestApps.SoftPhone.Windows.sln
          dotnet build CrestApps.SoftPhone.Windows.sln -c Release --no-restore
          dotnet test tests/SoftPhone.Core.Tests/SoftPhone.Core.Tests.csproj -c Release --no-build
          dotnet test tests/SoftPhone.Notifications.Tests/SoftPhone.Notifications.Tests.csproj -c Release --no-build

      - name: Decode signing certificate (if configured)
        if: ${{ env.SIGNING_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          "PFX_PATH=$env:RUNNER_TEMP\sign.pfx" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ---- Portable self-contained build ----
      - name: Publish portable (self-contained, win-x64)
        env:
          SOFTPHONE_VERSION: ${{ steps.ver.outputs.version }}
        run: >
          dotnet publish src/SoftPhone.App/SoftPhone.App.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -o artifacts/portable/SoftPhone

      - name: Sign app executable (if configured)
        if: ${{ env.PFX_PATH != '' }}
        shell: pwsh
        run: |
          $st = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $st sign /fd SHA256 /f "$env:PFX_PATH" /p "$env:SIGNING_PFX_PASSWORD" /tr http://timestamp.digicert.com /td SHA256 "artifacts/portable/SoftPhone/CrestApps.SoftPhone.exe"

      - name: Package portable zip
        shell: pwsh
        run: |
          Remove-Item artifacts/portable/SoftPhone/*.pdb, artifacts/portable/SoftPhone/*.xml -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path artifacts/dist | Out-Null
          Compress-Archive -Path artifacts/portable/SoftPhone -DestinationPath "artifacts/dist/SoftPhone-portable-v${{ steps.ver.outputs.version }}-win-x64.zip" -Force

      # ---- Inno Setup installer ----
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "/DPayloadDir=$PWD\artifacts\portable\SoftPhone" "deploy\installer\SoftPhone.iss"
          New-Item -ItemType Directory -Force -Path artifacts/dist | Out-Null
          Copy-Item "artifacts/installer/SoftPhone-Setup-v${{ steps.ver.outputs.version }}.exe" artifacts/dist/ -Force

      - name: Sign installer (if configured)
        if: ${{ env.PFX_PATH != '' }}
        shell: pwsh
        run: |
          $st = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $st sign /fd SHA256 /f "$env:PFX_PATH" /p "$env:SIGNING_PFX_PASSWORD" /tr http://timestamp.digicert.com /td SHA256 "artifacts/dist/SoftPhone-Setup-v${{ steps.ver.outputs.version }}.exe"

      # ---- MSIX — only when the Store is configured (STORE_APP_ID set); best-effort ----
      # Until then it's skipped, so tag/manual builds stay clean (the installer + zip are the
      # active distributables). Enable by adding the STORE_APP_ID secret once Partner Center
      # is approved. Needs -t:Restore because the .wapproj isn't part of the dotnet solution.
      - name: Build MSIX bundle
        if: ${{ env.STORE_APP_ID != '' }}
        continue-on-error: true
        shell: pwsh
        env:
          SOFTPHONE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # Build against whatever UAP platform SDK the runner actually has (the wapproj's
          # hard-pinned TargetPlatformVersion breaks with APPX3217 when that exact SDK isn't
          # installed — and runner images drift). Pick the highest installed UAP SDK.
          $uapRoot = "C:\Program Files (x86)\Windows Kits\10\Platforms\UAP"
          $tpv = (Get-ChildItem $uapRoot -Directory -ErrorAction SilentlyContinue |
                  Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1).Name
          if (-not $tpv) { throw "No UAP platform SDK found under $uapRoot on this runner." }
          Write-Host "Using TargetPlatformVersion=$tpv"
          msbuild packaging/SoftPhone.Package/SoftPhone.Package.wapproj `
            -t:Restore,Build `
            -p:Configuration=Release -p:Platform=x64 `
            -p:TargetPlatformVersion=$tpv `
            -p:UapAppxPackageBuildMode=StoreUpload `
            -p:AppxBundlePlatforms="x64" -p:AppxBundle=Always `
            -p:AppxPackageSigningEnabled=false `
            -p:AppxPackageDir="${{ github.workspace }}\artifacts\msix\\"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign MSIX (if configured)
        if: ${{ env.PFX_PATH != '' && env.STORE_APP_ID != '' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $st = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          Get-ChildItem artifacts/msix -Recurse -Include *.msix,*.msixbundle | ForEach-Object {
            & $st sign /fd SHA256 /f "$env:PFX_PATH" /p "$env:SIGNING_PFX_PASSWORD" /tr http://timestamp.digicert.com /td SHA256 $_.FullName
          }

      # ---- Store submission on tag (opt-in: only when STORE_APP_ID is set) ----
      # Pushing a vX.Y.Z tag also submits the freshly built MSIX to the Microsoft Store and
      # auto-commits it. Best-effort (continue-on-error) so a Store hiccup never blocks the
      # downloadable installer/zip release. Smoke-test the pipeline first with publish-manual.yml
      # (commit unchecked) to leave a draft submission before enabling this on real tags.
      - name: Submit to the Store
        if: ${{ env.STORE_APP_ID != '' && startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        shell: pwsh
        env:
          PARTNER_TENANT_ID: ${{ secrets.PARTNER_TENANT_ID }}
          PARTNER_CLIENT_ID: ${{ secrets.PARTNER_CLIENT_ID }}
          PARTNER_CLIENT_SECRET: ${{ secrets.PARTNER_CLIENT_SECRET }}
          STORE_APP_ID: ${{ secrets.STORE_APP_ID }}
        run: pwsh scripts/Submit-Store.ps1 -PackagePath "artifacts"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: distributables-v${{ steps.ver.outputs.version }}
          path: |
            artifacts/dist/**
            artifacts/msix/**/*.msix
            artifacts/msix/**/*.msixbundle
            artifacts/msix/**/*.msixupload
          if-no-files-found: error

  github-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributables-v${{ needs.build.outputs.version }}
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/dist/**
            artifacts/**/*.msix
            artifacts/**/*.msixbundle

  # Microsoft Store submission runs in the build job above, but only when STORE_APP_ID is set
  # (opt-in) and only on a tag, and it's best-effort — so tagging always produces a clean,
  # downloadable installer release even before Partner Center is configured. publish-manual.yml
  # remains the on-demand path for smoke-testing / draft submissions without cutting a tag.
