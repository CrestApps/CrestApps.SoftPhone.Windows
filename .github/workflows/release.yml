name: Release

# Build all distributables (installer .exe, portable .zip, MSIX) with the correct version:
#   • push a tag  vX.Y.Z         → build + attach to a GitHub Release (downloadable)
#   • run manually (workflow_dispatch, version input) → build artifacts only
# No Microsoft Store dependency (that's publish-manual.yml). If code-signing secrets are set
# (SIGNING_PFX_BASE64 + SIGNING_PFX_PASSWORD), the app exe, installer, and MSIX are signed.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 1.0.0 (no leading v)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      # Job-level so step `if:` conditions can see whether signing is configured.
      SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
      SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: microsoft/setup-msbuild@v2

      - name: Derive version (tag or manual input)
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then V="${{ inputs.version }}"; else V="${GITHUB_REF_NAME}"; fi
          echo "version=${V#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp MSIX manifest version
        run: pwsh scripts/Set-Version.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Restore + build + unit tests
        env:
          SOFTPHONE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          dotnet restore CrestApps.SoftPhone.Windows.sln
          dotnet build CrestApps.SoftPhone.Windows.sln -c Release --no-restore
          dotnet test tests/SoftPhone.Core.Tests/SoftPhone.Core.Tests.csproj -c Release --no-build
          dotnet test tests/SoftPhone.Notifications.Tests/SoftPhone.Notifications.Tests.csproj -c Release --no-build

      - name: Decode signing certificate (if configured)
        if: ${{ env.SIGNING_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          "PFX_PATH=$env:RUNNER_TEMP\sign.pfx" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ---- Portable self-contained build ----
      - name: Publish portable (self-contained, win-x64)
        env:
          SOFTPHONE_VERSION: ${{ steps.ver.outputs.version }}
        run: >
          dotnet publish src/SoftPhone.App/SoftPhone.App.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -o artifacts/portable/SoftPhone

      - name: Sign app executable (if configured)
        if: ${{ env.PFX_PATH != '' }}
        shell: pwsh
        run: |
          $st = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $st sign /fd SHA256 /f "$env:PFX_PATH" /p "$env:SIGNING_PFX_PASSWORD" /tr http://timestamp.digicert.com /td SHA256 "artifacts/portable/SoftPhone/CrestApps.SoftPhone.exe"

      - name: Package portable zip
        shell: pwsh
        run: |
          Remove-Item artifacts/portable/SoftPhone/*.pdb, artifacts/portable/SoftPhone/*.xml -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path artifacts/dist | Out-Null
          Compress-Archive -Path artifacts/portable/SoftPhone -DestinationPath "artifacts/dist/SoftPhone-portable-v${{ steps.ver.outputs.version }}-win-x64.zip" -Force

      # ---- Inno Setup installer ----
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "/DPayloadDir=$PWD\artifacts\portable\SoftPhone" "deploy\installer\SoftPhone.iss"
          New-Item -ItemType Directory -Force -Path artifacts/dist | Out-Null
          Copy-Item "artifacts/installer/SoftPhone-Setup-v${{ steps.ver.outputs.version }}.exe" artifacts/dist/ -Force

      - name: Sign installer (if configured)
        if: ${{ env.PFX_PATH != '' }}
        shell: pwsh
        run: |
          $st = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $st sign /fd SHA256 /f "$env:PFX_PATH" /p "$env:SIGNING_PFX_PASSWORD" /tr http://timestamp.digicert.com /td SHA256 "artifacts/dist/SoftPhone-Setup-v${{ steps.ver.outputs.version }}.exe"

      # ---- MSIX (best-effort; never blocks the installer release) ----
      - name: Build MSIX bundle
        continue-on-error: true
        env:
          SOFTPHONE_VERSION: ${{ steps.ver.outputs.version }}
        run: >
          msbuild packaging/SoftPhone.Package/SoftPhone.Package.wapproj
          -p:Configuration=Release -p:Platform=x64
          -p:UapAppxPackageBuildMode=StoreUpload
          -p:AppxBundlePlatforms="x64|arm64" -p:AppxBundle=Always
          -p:AppxPackageSigningEnabled=false
          -p:AppxPackageDir="${{ github.workspace }}\artifacts\msix\\"

      - name: Sign MSIX (if configured)
        if: ${{ env.PFX_PATH != '' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $st = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          Get-ChildItem artifacts/msix -Recurse -Include *.msix,*.msixbundle | ForEach-Object {
            & $st sign /fd SHA256 /f "$env:PFX_PATH" /p "$env:SIGNING_PFX_PASSWORD" /tr http://timestamp.digicert.com /td SHA256 $_.FullName
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: distributables-v${{ steps.ver.outputs.version }}
          path: |
            artifacts/dist/**
            artifacts/msix/**/*.msix
            artifacts/msix/**/*.msixbundle
            artifacts/msix/**/*.msixupload
          if-no-files-found: error

  github-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributables-v${{ needs.build.outputs.version }}
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/dist/**
            artifacts/**/*.msix
            artifacts/**/*.msixbundle

  # Microsoft Store submission is intentionally NOT here — it's a separate, opt-in workflow
  # (publish-manual.yml) so tagging always produces a clean, downloadable installer release
  # even before the Partner Center account is approved / secrets are configured.
